services:
  postgres:
    image: postgres:16-alpine
    container_name: toko_online_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: toko_online
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - toko_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: toko_online_email
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - toko_network

volumes:
  postgres_data:

networks:
  toko_network:
    driver: bridge
